name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

env:
  BUILD_TYPE: Release

jobs:
  windows:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
        arch: [x86, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C RELEASE -V

  mac:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C RELEASE -V

  linux:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        arch: [x86_64, aarch64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install QEMU for aarch64 emulation
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all

      - name: Upgrade gcc
        run: sudo apt-get install -y gcc g++

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C RELEASE -V

  dependency-chart:
    name: Dependency chart
    if: github.event_name == 'push' && github.ref == 'refs/heads/rework/bcs'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    concurrency:
      group: dependency-chart

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

      - name: Show the dependency chart on the run's summary page
        run: cat doc/DependencyChart.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the chart to the chart issue
        env:
          GH_TOKEN: ${{ github.token }}
          CHART_TITLE: Dependency chart
        run: |
          {
            cat doc/DependencyChart.md
            echo
            echo "Generated by CI from the \`${GITHUB_REF_NAME}\` branch. Edits made here are overwritten."
          } > chart-body.md
          numbers=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq ".[] | select(.pull_request == null and .user.login == \"github-actions[bot]\" and .title == \"${CHART_TITLE}\") | .number")
          number=$(echo "$numbers" | sort -n | head -n 1)
          if [ -z "$number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$CHART_TITLE" --body-file chart-body.md
            exit 0
          fi
          current=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${number}" --jq '.body' | tr -d '\r')
          wanted=$(tr -d '\r' < chart-body.md)
          if [ "$current" = "$wanted" ]; then
            echo "Issue #${number} already shows the current chart."
            exit 0
          fi
          gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file chart-body.md
